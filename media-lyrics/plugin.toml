# media-lyrics — Noctalia v5 plugin: media player panel with synced lyrics.
#
# Luau media panel: polls Noctalia's own D-Bus MPRIS aggregator
# (dev.noctalia.Mpris) from a [[service]], fetches synced lyrics from
# LRCLIB (exact /api/get first, then /api/search fallback), parses LRC in
# pure Luau, caches locally, and exposes everything to the [[panel]] over
# noctalia.state. YouTube metadata extraction uses an optional Python helper.
#
# Open the panel:  noctalia msg panel-toggle tranzem/media-lyrics:panel

id = "tranzem/media-lyrics"
name = "Media Lyrics"
version = "0.9.5"
plugin_api = 30
author = "tranzem"
license = "MIT"
tags = ["media", "music", "panel", "service"]
icon = "music"
description = "Synced and plain lyrics with optional YouTube chapters, cumulative album timelines and track identification. Runtime needs busctl + curl."
dependencies = ["busctl", "curl"]

[[setting]]
key = "youtube_fallback"
type = "bool"
label_key = "settings.youtube_fallback.label"
description_key = "settings.youtube_fallback.description"
default = true

[[setting]]
key = "yt_dlp_path"
type = "string"
label_key = "settings.yt_dlp_path.label"
description_key = "settings.yt_dlp_path.description"
default = ""

[[setting]]
key = "llm_backend"
type = "select"
label_key = "settings.llm_backend.label"
description_key = "settings.llm_backend.description"
default = "openrouter"
options = [
  { value = "none", label_key = "settings.llm_backend.options.none" },
  { value = "openai", label_key = "settings.llm_backend.options.openai" },
  { value = "anthropic", label_key = "settings.llm_backend.options.anthropic" },
  { value = "gemini", label_key = "settings.llm_backend.options.gemini" },
  { value = "xai", label_key = "settings.llm_backend.options.xai" },
  { value = "groq", label_key = "settings.llm_backend.options.groq" },
  { value = "mistral", label_key = "settings.llm_backend.options.mistral" },
  { value = "openrouter", label_key = "settings.llm_backend.options.openrouter" },
]

[[setting]]
key = "automatic_ai_fallback"
type = "bool"
label_key = "settings.automatic_ai_fallback.label"
description_key = "settings.automatic_ai_fallback.description"
default = false

[[setting]]
key = "openai_api_key"
type = "string"
label_key = "settings.openai_api_key.label"
description_key = "settings.openai_api_key.description"
visible_when = { key = "llm_backend", values = ["openai"] }
default = ""

[[setting]]
key = "openai_endpoint"
type = "string"
label_key = "settings.openai_endpoint.label"
description_key = "settings.openai_endpoint.description"
visible_when = { key = "llm_backend", values = ["openai"] }
default = "https://api.openai.com/v1"

[[setting]]
key = "openai_model"
type = "string"
label_key = "settings.openai_model.label"
description_key = "settings.openai_model.description"
visible_when = { key = "llm_backend", values = ["openai"] }
default = "gpt-5.6-luna"

[[setting]]
key = "anthropic_api_key"
type = "string"
label_key = "settings.anthropic_api_key.label"
description_key = "settings.anthropic_api_key.description"
visible_when = { key = "llm_backend", values = ["anthropic"] }
default = ""

[[setting]]
key = "anthropic_model"
type = "string"
label_key = "settings.anthropic_model.label"
description_key = "settings.anthropic_model.description"
visible_when = { key = "llm_backend", values = ["anthropic"] }
default = "claude-haiku-4-5"

[[setting]]
key = "gemini_api_key"
type = "string"
label_key = "settings.gemini_api_key.label"
description_key = "settings.gemini_api_key.description"
visible_when = { key = "llm_backend", values = ["gemini"] }
default = ""

[[setting]]
key = "gemini_model"
type = "string"
label_key = "settings.gemini_model.label"
description_key = "settings.gemini_model.description"
visible_when = { key = "llm_backend", values = ["gemini"] }
default = "gemini-flash-latest"

[[setting]]
key = "xai_api_key"
type = "string"
label_key = "settings.xai_api_key.label"
description_key = "settings.xai_api_key.description"
visible_when = { key = "llm_backend", values = ["xai"] }
default = ""

[[setting]]
key = "xai_model"
type = "string"
label_key = "settings.xai_model.label"
description_key = "settings.xai_model.description"
visible_when = { key = "llm_backend", values = ["xai"] }
default = "grok-4.3-latest"

[[setting]]
key = "groq_api_key"
type = "string"
label_key = "settings.groq_api_key.label"
description_key = "settings.groq_api_key.description"
visible_when = { key = "llm_backend", values = ["groq"] }
default = ""

[[setting]]
key = "groq_model"
type = "string"
label_key = "settings.groq_model.label"
description_key = "settings.groq_model.description"
visible_when = { key = "llm_backend", values = ["groq"] }
default = "openai/gpt-oss-120b"

[[setting]]
key = "mistral_api_key"
type = "string"
label_key = "settings.mistral_api_key.label"
description_key = "settings.mistral_api_key.description"
visible_when = { key = "llm_backend", values = ["mistral"] }
default = ""

[[setting]]
key = "mistral_model"
type = "string"
label_key = "settings.mistral_model.label"
description_key = "settings.mistral_model.description"
visible_when = { key = "llm_backend", values = ["mistral"] }
default = "mistral-small-latest"

[[setting]]
key = "openrouter_api_key"
type = "string"
label_key = "settings.openrouter_api_key.label"
description_key = "settings.openrouter_api_key.description"
visible_when = { key = "llm_backend", values = ["openrouter"] }
default = ""

[[setting]]
key = "openrouter_model"
type = "string"
label_key = "settings.openrouter_model.label"
description_key = "settings.openrouter_model.description"
visible_when = { key = "llm_backend", values = ["openrouter"] }
default = "~google/gemini-flash-latest"

[[setting]]
key = "llm_max_tokens"
type = "string"
label_key = "settings.llm_max_tokens.label"
description_key = "settings.llm_max_tokens.description"
default = "32768"

[[setting]]
key = "llm_database_search_limit"
type = "string"
label_key = "settings.llm_database_search_limit.label"
description_key = "settings.llm_database_search_limit.description"
default = "4"

[[setting]]
key = "llm_web_search_limit"
type = "string"
label_key = "settings.llm_web_search_limit.label"
description_key = "settings.llm_web_search_limit.description"
default = "4"

[[setting]]
key = "llm_album_page_limit"
type = "string"
label_key = "settings.llm_album_page_limit.label"
description_key = "settings.llm_album_page_limit.description"
default = "4"

[[setting]]
key = "offset_ms"
type = "int"
label_key = "settings.offset_ms.label"
description_key = "settings.offset_ms.description"
default = 0

[[setting]]
key = "panel_size"
type = "select"
label_key = "settings.panel_size.label"
description_key = "settings.panel_size.description"
default = "medium"
options = [
  { value = "mini", label_key = "settings.panel_size.options.mini" },
  { value = "compact", label_key = "settings.panel_size.options.compact" },
  { value = "medium", label_key = "settings.panel_size.options.medium" },
  { value = "large", label_key = "settings.panel_size.options.large" },
]

[[setting]]
key = "use_cache"
type = "bool"
label_key = "settings.use_cache.label"
description_key = "settings.use_cache.description"
default = true

[[setting]]
key = "local_lyrics_dir"
type = "folder"
label_key = "settings.local_lyrics_dir.label"
description_key = "settings.local_lyrics_dir.description"
default = "~/.local/share/media-lyrics"

# Player filtering: comma-separated identity or bus-name substrings. When
# allowlist is non-empty, only matching players are shown; blocklist excludes
# matching players. Empty = no filtering (show the active player).
[[setting]]
key = "player_allowlist"
type = "string"
label_key = "settings.player_allowlist.label"
description_key = "settings.player_allowlist.description"
default = ""

[[setting]]
key = "player_blocklist"
type = "string"
label_key = "settings.player_blocklist.label"
description_key = "settings.player_blocklist.description"
default = ""

# Bar widget: compact now-playing chip; opens the panel on click.
[[widget]]
id = "now-playing"
entry = "widget.luau"

  # Gestures mirror the shell's built-in media widget (noctalia-dev/noctalia
  # src/shell/bar/widget_gesture_defaults.cpp): right toggles playback, thumb
  # buttons and the scroll wheel skip tracks. Middle is deliberately NOT
  # bound here — every widget gets the host default `settings-open-widget`,
  # so middle click opens this widget's settings like any other bar app.
  [widget.actions]
  right       = "media toggle"
  back        = "media previous"
  forward     = "media next"
  scroll_up   = "media next"
  scroll_down = "media previous"

  # Display settings — same knobs as the shell's built-in media widget
  # (media_widget_definition.cpp). Edited in the widget's own settings popup
  # (middle click) and read with noctalia.getConfig(key) in widget.luau.
  [[widget.setting]]
  key = "album_art_only"
  type = "bool"
  label_key = "settings.album_art_only.label"
  description_key = "settings.album_art_only.description"
  default = false

  [[widget.setting]]
  key = "hide_album_art"
  type = "bool"
  label_key = "settings.hide_album_art.label"
  description_key = "settings.hide_album_art.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "hide_artist"
  type = "bool"
  label_key = "settings.hide_artist.label"
  description_key = "settings.hide_artist.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "artist_first"
  type = "bool"
  label_key = "settings.artist_first.label"
  description_key = "settings.artist_first.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "min_length"
  type = "int"
  label_key = "settings.min_length.label"
  description_key = "settings.min_length.description"
  default = 80
  min = 0
  max = 800
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "max_length"
  type = "int"
  label_key = "settings.max_length.label"
  description_key = "settings.max_length.description"
  default = 220
  min = 40
  max = 800
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "art_size"
  type = "int"
  label_key = "settings.art_size.label"
  description_key = "settings.art_size.description"
  default = 16
  min = 8
  max = 96
  visible_when = { key = "hide_album_art", values = ["false"] }

  [[widget.setting]]
  key = "title_scroll"
  type = "select"
  label_key = "settings.title_scroll.label"
  description_key = "settings.title_scroll.description"
  default = "none"
  options = [
    { value = "none", label_key = "settings.title_scroll.options.none" },
    { value = "always", label_key = "settings.title_scroll.options.always" },
    { value = "on_hover", label_key = "settings.title_scroll.options.on_hover" },
  ]
  visible_when = { key = "album_art_only", values = ["false"] }

  [[widget.setting]]
  key = "hide_when_no_media"
  type = "bool"
  label_key = "settings.hide_when_no_media.label"
  description_key = "settings.hide_when_no_media.description"
  default = false

  # Extra (beyond the built-in media widget): show the current synced lyric
  # line in the chip instead of the artist while lyrics are ready.
  [[widget.setting]]
  key = "show_lyric_line"
  type = "bool"
  label_key = "settings.show_lyric_line.label"
  description_key = "settings.show_lyric_line.description"
  default = false
  visible_when = { key = "album_art_only", values = ["false"] }

  # (show_progress was dropped — see ROADMAP "show_progress in bar widget")

# Background service: polls D-Bus for player state, fetches + parses lyrics,
# and publishes a snapshot to noctalia.state for the panel.
[[service]]
id = "service"
entry = "service.luau"

# Main panel: header (cover | title/artist | transport) + karaoke lyrics view.
# Three size presets share one entry; panel_size selects which one the widget
# and the control-center tile open. Medium (520) is the default and keeps the
# historical `panel` id for IPC compatibility.
# NOTE: the canonical repo also declares layer = "overlay" on every panel
# (lyrics above fullscreen video); this store copy omits the field until the
# validator learns it — use the host-injected per-entry Layer dropdown
# (Settings -> Plugins, Noctalia 5.0.1+) to pick "overlay" instead.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 520
height = 520
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return", "Space"]

[[panel]]
id = "panel-compact"
entry = "panel.luau"
width = 440
height = 440
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return", "Space"]

[[panel]]
id = "panel-large"
entry = "panel.luau"
width = 640
height = 640
keyboard_focus = "exclusive"
capture_keys = ["Up", "Down", "Return", "Space"]

# Compact mini panel: cover + current lyric line only, pinnable to the desktop
# (placement = "floating", position = "center"). A lightweight always-on
# karaoke line without the full transport/header chrome.
[[panel]]
id = "panel-mini"
entry = "panel-mini.luau"
width = 360
height = 120
placement = "floating"
position = "center"
keyboard_focus = "none"
dismiss_on_outside_click = false

# Control-center tile: quick panel open.
[[shortcut]]
id = "toggle"
entry = "shortcut.luau"
